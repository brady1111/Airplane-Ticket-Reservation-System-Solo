<div class="customer-home-page-container">
    <header>
        <h1>Airplane Ticket Reservation</h1>
    </header>

    <main>
        <h2>Find a Flight</h2>

        <div class="search-flight">
            <label for="departure">Departure Airport:</label>
            <input type="text" id="departure" name="departure" placeholder="Search for an airport">

            <label for="arrival">Arrival Airport:</label>
            <input type="text" id="arrival" name="arrival" placeholder="Search for an airport">

            <label for="date">Departure Date:</label>
            <input type="date" id="date" name="date">

            <button>Search Flights</button>
        </div>

    </main>
</div>
