<div class="login-page-container">
    <header>
        <h1>Airplane Ticket Reservation</h1>
    </header>

    <main>
        <h2>Log In</h2>

        <form class="login-form" (submit)="submitLogin($event)">
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                (input)="username = $any($event.target).value; errorMessage.set('')"
            >
            <p class="error-message">{{ usernameError }}</p>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                (input)="password = $any($event.target).value; errorMessage.set('')"
            >
            <p class="error-message">{{ passwordError }}</p>

            <p class="error-message">{{ errorMessage() }}</p>

            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account? <a routerLink="/create-account">Sign Up</a></p>
    </main>
</div>
